name: Build NEON DRIFT 3D

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: neondrift
    steps:
      - uses: actions/checkout@v4
      - name: Bundle Three.js locally (offline play, no CDN)
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js -o app/src/main/assets/three.module.js
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js#/assets/three.module.js#' app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build signed release (APK + AAB)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          gradle --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: NEON-DRIFT-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: env.KS_B64 != ''
        with:
          name: NEON-DRIFT-RUSTORE
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
